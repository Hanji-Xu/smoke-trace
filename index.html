<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>07 Smoke Trace</title>
<!--
  07 Smoke Trace
  Observation: a smoke trail is a data visualization of air movement, aggregated over time.
  Smoke from a fixed source is a *streakline*: the locus of every air parcel that has passed
  through the source. This page runs a real-time 2D incompressible fluid simulation on the GPU
  (Stam-style stable fluids, MacCormack advection, Boussinesq buoyancy, SI units, 1:1 real time)
  and lets you compare the smoke with the flow's other "portraits": raw velocity vectors,
  streamlines, pathlines and streaklines.
  Self-contained: no network, no libraries. Needs WebGL2 + EXT_color_buffer_float.
  Equations, constants and every estimate are documented in the "Physics & constants" panel
  (search for ABOUT_HTML below) and in the CONST / SRC objects. Estimated values are marked ★.
-->
<style>
:root{
  --bg:#0b0c0f; --panel:rgba(18,20,26,.86); --ink:#e8e6e1; --dim:#9a9ca3; --line:rgba(255,255,255,.09);
  --accent:#ffb347; --streak:#ffb347; --path:#5fd4ff; --stream:#ff6fb5; --vec:#b7f36b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:13px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:grab}
#ov.probe{cursor:crosshair}
#title{position:fixed;left:16px;top:14px;pointer-events:none}
#title h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.01em}
#title p{margin:2px 0 0;color:var(--dim);max-width:420px}
#panel{position:fixed;right:12px;top:12px;bottom:12px;width:292px;background:var(--panel);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;
  overflow:auto;padding:10px 12px 14px;transition:transform .25s}
#panel.hidden{transform:translateX(calc(100% + 20px))}
#toggle{position:fixed;right:16px;top:16px;z-index:5;display:none}
#panel.hidden ~ #toggle{display:block}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:14px 0 6px;font-weight:600}
h2:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row label{flex:1}
.row output{min-width:64px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
button,select{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:5px 9px;font:inherit;cursor:pointer}
button:hover{background:rgba(255,255,255,.12)}
button.on{background:rgba(255,179,71,.18);border-color:rgba(255,179,71,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0;cursor:pointer}
.note{color:var(--dim);font-size:12px;margin:4px 0}
.star{color:var(--accent)}
#hud{position:fixed;left:16px;bottom:14px;pointer-events:none;font-variant-numeric:tabular-nums;color:var(--dim);
  font-size:12px;white-space:pre;text-shadow:0 1px 2px #000}
#about{position:fixed;inset:0;background:rgba(5,6,8,.72);display:none;z-index:10;padding:16px}
#about.open{display:block}
#about .box{max-width:820px;max-height:100%;overflow:auto;margin:0 auto;background:#121419;border:1px solid var(--line);
  border-radius:12px;padding:18px 22px}
#about h3{margin:18px 0 6px;font-size:14px}
#about table{border-collapse:collapse;width:100%;font-size:12.5px}
#about td,#about th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
#about .eq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.04);padding:8px 10px;border-radius:7px;
  white-space:pre-wrap;line-height:1.7}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim)}
@media (max-width:640px){
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:46vh}
  #title p{display:none}
  #hud{bottom:auto;top:44px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="title"><h1>Smoke Trace</h1><p>Smoke is a streakline: a record of everywhere the air has carried it. Drag to wave a hand through the air.</p></div>
<div id="hud"></div>
<div id="err"></div>

<div id="panel">
  <h2>Presets</h2>
  <div class="grid2" id="presets"></div>

  <h2>Visualize</h2>
  <label class="chk"><input type="checkbox" id="vSmoke" checked> Smoke (density field)</label>
  <label class="chk"><input type="checkbox" id="vHeat"> Heat (excess temperature)</label>
  <label class="chk"><input type="checkbox" id="vVec"><span class="sw" style="background:var(--vec)"></span>Velocity vectors (raw field)</label>
  <label class="chk"><input type="checkbox" id="vStreak"><span class="sw" style="background:var(--streak)"></span>Streaklines</label>
  <label class="chk"><input type="checkbox" id="vPath"><span class="sw" style="background:var(--path)"></span>Pathlines</label>
  <label class="chk"><input type="checkbox" id="vStream"><span class="sw" style="background:var(--stream)"></span>Streamlines (from seeds)</label>
  <label class="chk"><input type="checkbox" id="vField"> Streamline field (whole domain)</label>
  <p class="note" id="lineNote"></p>

  <h2>Sources</h2>
  <div class="grid2">
    <button id="bCandle">Candle</button><button id="bSnuff">Snuff out</button>
    <button id="bIncense">Incense</button><button id="bWave">Auto hand wave</button>
  </div>
  <div class="row" style="margin-top:8px">
    <label class="chk" style="flex:1"><input type="radio" name="tool" value="hand" checked> Drag = hand</label>
    <label class="chk" style="flex:1"><input type="radio" name="tool" value="probe"> Click = probe</label>
  </div>
  <p class="note">Probes are extra seed points for the lines. Click a probe again to remove it. <button id="bClearProbes" style="padding:2px 7px">Clear</button></p>

  <h2>Air</h2>
  <div class="row"><label for="sBreeze">Breeze from left</label><output id="oBreeze"></output></div>
  <input type="range" id="sBreeze" min="0" max="0.5" step="0.01" value="0">
  <div class="row"><label for="sGust">Gustiness <span class="star">★</span></label><output id="oGust"></output></div>
  <input type="range" id="sGust" min="0" max="1" step="0.05" value="0">
  <div class="row"><label for="sDraft">Room draft <span class="star">★</span></label><output id="oDraft"></output></div>
  <input type="range" id="sDraft" min="0" max="0.1" step="0.005" value="0.02">
  <div class="row"><label for="sCool">Out-of-plane heat loss <span class="star">★</span></label><output id="oCool"></output></div>
  <input type="range" id="sCool" min="0" max="2" step="0.05" value="0">

  <h2>Simulation</h2>
  <div class="row"><label for="sSpeed">Time scale</label><output id="oSpeed"></output></div>
  <input type="range" id="sSpeed" min="0.1" max="1" step="0.05" value="1">
  <div class="row"><label for="sIter">Pressure V-cycles</label><output id="oIter"></output></div>
  <input type="range" id="sIter" min="1" max="8" step="1" value="3">
  <div class="row"><label for="sRes">Grid (cells tall)</label>
    <select id="sRes"><option>192</option><option selected>320</option><option>448</option></select></div>
  <label class="chk"><input type="checkbox" id="cMac" checked> MacCormack advection (less numerical blur)</label>
  <div class="grid2" style="margin-top:8px">
    <button id="bPause">Pause</button><button id="bReset">Reset air</button>
  </div>
  <div style="margin-top:10px" class="grid2">
    <button id="bAbout" style="grid-column:span 2">Physics &amp; constants</button>
    <button id="bHide" style="grid-column:span 2">Hide panel</button>
  </div>
</div>
<button id="toggle">Controls</button>

<div id="about"><div class="box" id="aboutBox"></div></div>

<script>
'use strict';
/* ==========================================================================
   CONSTANTS (SI units). ★ = estimate, not a measured value for this scene.
   ========================================================================== */
const CONST = {
  g: 9.81,          // m/s², standard gravity
  T0: 293.15,       // K, ambient air temperature (20 °C)
  nu: 1.5e-5,       // m²/s, kinematic viscosity of air at 20 °C (1.516e-5)
  alpha: 2.2e-5,    // m²/s, thermal diffusivity of air at 20 °C (≈2.2e-5)
  H: 0.60,          // m, height of the simulated window (table top to top edge)
};
// Source models. All source numbers are ★ estimates chosen to land in published ranges,
// because a 2D grid with mm-sized cells cannot resolve a flame or a smouldering tip.
const SRC = {
  candle: { xFrac: 0.22, bodyW: 0.022, bodyH: 0.090, flameH: 0.030,
            y: 0.128,     // m, plume source centre ~0.8 cm above the visible flame tip
            R: 0.005,     // m ★ Gaussian radius of the imposed hot patch (flame ~1 cm wide)
            dT: 250,      // K ★ excess temperature just above the flame (gas ~500-600 K)
            w0: 0.50,     // m/s ★ upward velocity there (candle plumes: ~0.3-1 m/s)
            smoke: 0.03 },// ★ a steady candle is almost sootless: trace only
  snuff:  { y: 0.093, R: 0.003,
            dT0: 150, tauT: 1.0,     // K, s ★ smouldering wick cools in ~1 s
            s0: 2.5, tauS: 2.5,      // ★ dense white wisp fading over a few seconds (smoke units are arbitrary)
            dur: 9 },
  incense:{ xFrac: 0.46, tipY: 0.20,
            R: 0.0016,    // m ★ smouldering tip ~2-3 mm across (clamped to ≥0.7 cell)
            dT: 40,       // K ★ plume excess temperature right at the tip
            smoke: 1.0 },
  hand:   { R: 0.035,     // m ★ Gaussian radius: a palm seen edge-on, ~7-8 cm
            maxV: 5 },    // m/s clamp on pointer-derived hand speed
  wave:   { y: 0.33, period: 1.6, ampMax: 0.15 },   // auto wave: peak speed 2πA/T ≈ 0.59 m/s
  draft:  { rate: 3, R: 0.06, blend: 0.3 },         // ★ random room air motion
  gustPeriod: 4.0,                                  // s ★
};

/* ==========================================================================
   STATE
   ========================================================================== */
const S = {
  res: 320, vcycles: 3, mac: true, openTop: true, openRight: true, openLeft: true, timeScale: 1, paused: false,
  smoke: true, heat: false, vec: false, streak: false, path: false, stream: false, field: false,
  candle: true, snuffT: -1, autoSnuffAt: -1, incense: true, wave: false,
  breeze: 0, gust: 0, draft: 0.02, cool: 0,
  tool: 'hand',
};
let simT = 0;              // simulated seconds
let nx, ny, dx, Wm, Hm;    // grid + physical size (m)
let Wvis;                  // visible width (m); the grid extends past the right edge to a multiple of 64 cells
const probes = [];         // extra seeds {x,y} in metres
const hand = { on: false, x: 0, y: 0, vx: 0, vy: 0, lastX: 0, lastY: 0, lastT: 0 };

/* ==========================================================================
   WEBGL SETUP
   ========================================================================== */
const glc = document.getElementById('gl');
const ov = document.getElementById('ov');
const ctx = ov.getContext('2d');
const gl = glc.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false });
function fail(msg) { const e = document.getElementById('err'); e.style.display = 'flex'; e.textContent = msg; throw new Error(msg); }
if (!gl) fail('This piece needs WebGL2.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('This piece needs float render targets (EXT_color_buffer_float).');

const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1., 0., 1.); }`;

// Shared fragment header. Ghost-cell rules implement the boundary conditions:
//   bottom y<0  : free-slip wall (the table: normal velocity mirrored, others zero-gradient)
//   left   x<0  : open, or with a breeze an inflow u = breeze, v = 0, ΔT = 0, smoke = 0
//   right, top  : open (zero-gradient, p = 0 on the face) or free-slip wall, per uOpen
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform ivec2 uN; uniform float uBreeze; uniform vec3 uOpen;   // uOpen = (left, right, top) open?
out vec4 o;
vec4 G(sampler2D s, ivec2 c){
  if(c.x < 0){ if(uOpen.x < .5) return vec4(uBreeze, 0., 0., 0.); c.x = 0; }
  vec4 m = vec4(1.);
  if(c.x >= uN.x){ c.x = uN.x-1; if(uOpen.y < .5) m.x = -1.; }
  if(c.y < 0){ c.y = 0; m.y = -1.; }
  if(c.y >= uN.y){ c.y = uN.y-1; if(uOpen.z < .5) m.y = -1.; }
  return m*texelFetch(s, c, 0);
}
// pressure ghost cells: Neumann (∂p/∂n = 0) at walls, p = 0 on the face of open edges.
// Both are imposed at cell faces, so every multigrid level sees the same boundary.
float PG(sampler2D p, ivec2 c, float pc){
  if(c.y < 0) return pc;
  if(c.x < 0) return uOpen.x > .5 ? -pc : pc;
  if(c.x >= uN.x) return uOpen.y > .5 ? -pc : pc;
  if(c.y >= uN.y) return uOpen.z > .5 ? -pc : pc;
  return texelFetch(p, c, 0).x;
}
// bilinear sample, p in cell units (cell centres at i+0.5)
vec4 BL(sampler2D s, vec2 p){
  vec2 q = clamp(p - .5, vec2(-1.), vec2(uN)); ivec2 i = ivec2(floor(q)); vec2 f = q - vec2(i);
  return mix(mix(G(s,i), G(s,i+ivec2(1,0)), f.x), mix(G(s,i+ivec2(0,1)), G(s,i+ivec2(1,1)), f.x), f.y);
}
// RK2 (midpoint) back-trace through velocity field v, dt in s, dx in m
vec2 trace(sampler2D v, ivec2 c, float dt, float dx){
  vec2 x = vec2(c) + .5;
  vec2 u0 = texelFetch(v, c, 0).xy;
  vec2 um = BL(v, x - .5*dt*u0/dx).xy;
  return x - dt*um/dx;
}
`;

const FS = {
  advect: HEAD + `
uniform sampler2D uV, uQ; uniform float uDt, uDx;
void main(){ o = BL(uQ, trace(uV, ivec2(gl_FragCoord.xy), uDt, uDx)); }`,

  // MacCormack correction (Selle et al. 2008) with min/max limiter for stability
  correct: HEAD + `
uniform sampler2D uS, uA, uB; uniform float uDt, uDx;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec2 p = trace(uS, c, uDt, uDx);
  vec4 r = texelFetch(uA,c,0) + .5*(texelFetch(uS,c,0) - texelFetch(uB,c,0));
  vec2 q = clamp(p - .5, vec2(-1.), vec2(uN)); ivec2 i = ivec2(floor(q));
  vec4 a = G(uS,i), b = G(uS,i+ivec2(1,0)), d = G(uS,i+ivec2(0,1)), e = G(uS,i+ivec2(1,1));
  o = clamp(r, min(min(a,b),min(d,e)), max(max(a,b),max(d,e)));
}`,

  // viscosity, thermal diffusion, Boussinesq buoyancy, heat loss, sources
  forces: HEAD + `
uniform sampler2D uS; uniform float uDt, uDx, uG, uT0, uNu, uAl, uCool, uAccel;
uniform int uK; uniform vec4 uPa[12]; uniform vec4 uPb[12]; uniform vec4 uPm[12];
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(uS, c, 0);
  vec4 lap = (G(uS,c-ivec2(1,0)) + G(uS,c+ivec2(1,0)) + G(uS,c-ivec2(0,1)) + G(uS,c+ivec2(0,1)) - 4.*s)/(uDx*uDx);
  s.xy += uDt*uNu*lap.xy;
  s.z  += uDt*uAl*lap.z;
  s.y  += uDt*uG*s.z/uT0;          // Boussinesq: a = g β ΔT, β = 1/T0
  s.z  *= exp(-uCool*uDt);
  s.x  += uDt*uAccel;              // uniform free-stream acceleration dU/dt
  vec2 x = (vec2(c) + .5)*uDx;
  for(int k = 0; k < 12; k++){
    if(k >= uK) break;
    vec4 a = uPa[k], b = uPb[k], m = uPm[k];       // a: x,y,R,strength  b: targets u,v,ΔT,smoke  m: masks
    vec2 d = x - a.xy;
    float w = a.w*exp(-dot(d,d)/(a.z*a.z));
    s.xy = mix(s.xy, b.xy, w*m.x);
    s.z  = mix(s.z,  b.z,  w*m.y);
    s.w  = mix(s.w,  b.w,  w*m.z);
  }
  o = s;
}`,

  div: HEAD + `
uniform sampler2D uS; uniform float uDx;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  float L = G(uS,c-ivec2(1,0)).x, R = G(uS,c+ivec2(1,0)).x, D = G(uS,c-ivec2(0,1)).y, T = G(uS,c+ivec2(0,1)).y;
  o = vec4((R-L+T-D)/(2.*uDx), 0., 0., 0.);
}`,

  // ---- pressure Poisson solve ∇²p = ∇·u* by geometric multigrid (V-cycles) ----
  // weighted-Jacobi smoother on any level; uH = that level's cell size
  smooth: HEAD + `
uniform sampler2D uP, uF; uniform float uH, uW;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy); float pc = texelFetch(uP,c,0).x;
  float s = PG(uP,c-ivec2(1,0),pc) + PG(uP,c+ivec2(1,0),pc) + PG(uP,c-ivec2(0,1),pc) + PG(uP,c+ivec2(0,1),pc);
  float pj = (s - uH*uH*texelFetch(uF,c,0).x)*.25;
  o = vec4(mix(pc, pj, uW), 0., 0., 0.);
}`,
  resid: HEAD + `
uniform sampler2D uP, uF; uniform float uH;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy); float pc = texelFetch(uP,c,0).x;
  float s = PG(uP,c-ivec2(1,0),pc) + PG(uP,c+ivec2(1,0),pc) + PG(uP,c-ivec2(0,1),pc) + PG(uP,c+ivec2(0,1),pc);
  o = vec4(texelFetch(uF,c,0).x - (s - 4.*pc)/(uH*uH), 0., 0., 0.);
}`,
  // full-weighting over the 2×2 fine cells under each coarse cell (uN = coarse size, uNf = fine size)
  restrict: HEAD + `
uniform sampler2D uR; uniform ivec2 uNf;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy)*2; float s = 0., n = 0.;
  for(int j = 0; j < 2; j++) for(int i = 0; i < 2; i++){
    ivec2 q = c + ivec2(i,j);
    if(q.x < uNf.x && q.y < uNf.y){ s += texelFetch(uR,q,0).x; n += 1.; }
  }
  o = vec4(s/max(n,1.), 0., 0., 0.);
}`,
  // bilinear prolongation of the coarse correction, added to the fine solution (uN = fine size)
  prolong: HEAD + `
uniform sampler2D uP, uC; uniform ivec2 uNc;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec2 q = clamp((vec2(c) + .5)*.5 - .5, vec2(0.), vec2(uNc - 1));
  ivec2 i = ivec2(floor(q)); vec2 f = q - vec2(i); ivec2 j = min(i + 1, uNc - 1);
  float e = mix(mix(texelFetch(uC,i,0).x, texelFetch(uC,ivec2(j.x,i.y),0).x, f.x),
                mix(texelFetch(uC,ivec2(i.x,j.y),0).x, texelFetch(uC,j,0).x, f.x), f.y);
  o = vec4(texelFetch(uP,c,0).x + e, 0., 0., 0.);
}`,

  grad: HEAD + `
uniform sampler2D uS, uP; uniform float uDx;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy); float pc = texelFetch(uP,c,0).x;
  vec4 s = texelFetch(uS, c, 0);
  s.x -= (PG(uP,c+ivec2(1,0),pc) - PG(uP,c-ivec2(1,0),pc))/(2.*uDx);
  s.y -= (PG(uP,c+ivec2(0,1),pc) - PG(uP,c-ivec2(0,1),pc))/(2.*uDx);
  o = s;
}`,

  display: HEAD + `
uniform sampler2D uS; uniform vec2 uRes; uniform float uSmoke, uHeat;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec4 s = BL(uS, gl_FragCoord.xy/uRes.y*float(uN.y));
  vec3 col = mix(vec3(.030,.032,.040), vec3(.070,.075,.090), uv.y);
  col *= 1. - .35*pow(abs(uv.x-.5)*2., 3.);
  float h = 1. - exp(-max(s.z,0.)/60.);
  col += uHeat*h*vec3(1.,.42,.10)*.75;
  float a = uSmoke*(1. - exp(-2.6*max(s.w,0.)));   // Beer-Lambert style opacity
  col = mix(col, vec3(.80,.84,.91), a);
  o = vec4(pow(col, vec3(.95)), 1.);
}`,
};

function compile(type, src) {
  const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) fail('Shader error: ' + gl.getShaderInfoLog(sh));
  return sh;
}
const vsh = compile(gl.VERTEX_SHADER, VS);
const prog = {};
for (const k in FS) {
  const p = gl.createProgram();
  gl.attachShader(p, vsh); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, FS[k])); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link error: ' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const nm = info.name.replace(/\[0\]$/, ''); u[nm] = gl.getUniformLocation(p, info.name); }
  prog[k] = { p, u };
}
gl.bindVertexArray(gl.createVertexArray());

function makeTarget(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { t, f, w, h };
}
let T = null;       // textures: st, a, b, c, div, p0, p1
let MG = [];        // multigrid levels: {w, h, hm, p0, p1, f, r}
let readBuf = null; // CPU copy of state: u, v, ΔT, smoke per cell

function freeTargets() {
  const del = o => { gl.deleteTexture(o.t); gl.deleteFramebuffer(o.f); };
  if (T) for (const k in T) del(T[k]);
  for (const L of MG.slice(1)) for (const k of ['p0', 'p1', 'f', 'r']) del(L[k]);
  if (MG[0]) del(MG[0].r);
  MG = [];
}

function buildSim() {
  freeTargets();
  const cw = Math.max(1, ov.clientWidth), ch = Math.max(1, ov.clientHeight);
  // grid sizes are multiples of 64 so all multigrid levels nest exactly
  ny = S.res; nx = Math.max(64, Math.ceil(ny*cw/ch/64)*64);
  dx = CONST.H/ny; Wm = nx*dx; Hm = ny*dx; Wvis = Hm*cw/ch;
  T = { st: makeTarget(nx, ny), a: makeTarget(nx, ny), b: makeTarget(nx, ny), c: makeTarget(nx, ny),
        div: makeTarget(nx, ny), p0: makeTarget(nx, ny), p1: makeTarget(nx, ny) };
  readBuf = new Float32Array(nx*ny*4);
  lastBreeze = 0;
  MG = [{ w: nx, h: ny, hm: dx, p0: T.p0, p1: T.p1, f: T.div, r: makeTarget(nx, ny) }];
  while (Math.min(MG[MG.length - 1].w, MG[MG.length - 1].h) > 6) {
    const L = MG[MG.length - 1], w = Math.ceil(L.w/2), h = Math.ceil(L.h/2);
    MG.push({ w, h, hm: L.hm*2, p0: makeTarget(w, h), p1: makeTarget(w, h), f: makeTarget(w, h), r: makeTarget(w, h) });
  }
  resetParticles();
}

function run(name, target, uniforms, textures) {
  const P = prog[name]; gl.useProgram(P.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null);
  const w = target ? target.w : glc.width, h = target ? target.h : glc.height;
  gl.viewport(0, 0, w, h);
  gl.uniform2i(P.u.uN, target ? w : nx, target ? h : ny);
  gl.uniform1f(P.u.uBreeze, breezeNow());
  gl.uniform3f(P.u.uOpen, openLeft() ? 1 : 0, openRight() ? 1 : 0, S.openTop ? 1 : 0);
  let unit = 0;
  for (const k in textures) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, textures[k].t); gl.uniform1i(P.u[k], unit++); }
  for (const k in uniforms) {
    const v = uniforms[k], loc = P.u[k]; if (loc == null) continue;
    if (typeof v === 'number') gl.uniform1f(loc, v);
    else if ('int' in v) gl.uniform1i(loc, v.int);
    else if (v.v2) gl.uniform2fv(loc, v.v2);
    else if (v.i2) gl.uniform2iv(loc, v.i2);
    else if (v.v4) gl.uniform4fv(loc, v.v4);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ==========================================================================
   SOURCES -> uniform arrays
   ========================================================================== */
// With no breeze, every edge except the table is open: the window looks into a large still room.
// With a breeze, the left edge becomes a uniform inflow and the right edge an outflow.
const openLeft = () => S.breeze <= 0 && S.openLeft;
const openRight = () => S.breeze > 0 || S.openRight;
function smoothN(L, n) {
  for (let i = 0; i < n; i++) { run('smooth', L.p1, { uH: L.hm, uW: 0.8 }, { uP: L.p0, uF: L.f }); [L.p0, L.p1] = [L.p1, L.p0]; }
}
function vcycle(l) {
  const L = MG[l];
  if (l === MG.length - 1) { smoothN(L, 30); return; }
  smoothN(L, 3);
  run('resid', L.r, { uH: L.hm }, { uP: L.p0, uF: L.f });
  const C = MG[l + 1];
  run('restrict', C.f, { uNf: { i2: [L.w, L.h] } }, { uR: L.r });
  gl.bindFramebuffer(gl.FRAMEBUFFER, C.p0.f); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  vcycle(l + 1);
  run('prolong', L.p1, { uNc: { i2: [C.w, C.h] } }, { uP: L.p0, uC: C.p0 });
  [L.p0, L.p1] = [L.p1, L.p0];
  smoothN(L, 3);
}
// The breeze is a uniform free stream U(t). Its changes are applied to the whole window as a
// uniform acceleration dU/dt (the large-scale pressure gradient that drives a real gust), and the
// left edge supplies inflow at U(t).
const breezeAt = t => S.breeze*(1 + S.gust*Math.sin(2*Math.PI*t/SRC.gustPeriod));
const breezeNow = () => breezeAt(simT);
let lastBreeze = 0;
const candleX = () => SRC.candle.xFrac*Wvis;
const incenseX = () => SRC.incense.xFrac*Wvis;
function waveState(t) {
  const A = Math.min(SRC.wave.ampMax, 0.3*Wvis), w = 2*Math.PI/SRC.wave.period, xc = 0.43*Wvis;
  return { x: xc + A*Math.sin(w*t), y: SRC.wave.y, vx: A*w*Math.cos(w*t), vy: 0 };
}
let draftQueue = [];
function gatherSources(dt) {
  const a = [], b = [], m = [];
  const add = (x, y, R, str, tu, tv, tT, ts, mu, mT, ms) => { a.push(x, y, Math.max(R, 0.7*dx), str); b.push(tu, tv, tT, ts); m.push(mu, mT, ms, 0); };
  const C = SRC.candle;
  if (S.candle) add(candleX(), C.y, C.R, 1, 0, C.w0, C.dT, C.smoke, 1, 1, 1);
  else if (S.snuffT >= 0) {
    const t = simT - S.snuffT, N = SRC.snuff;
    if (t < N.dur) add(candleX(), N.y, N.R, 1, 0, 0, N.dT0*Math.exp(-t/N.tauT), N.s0*Math.exp(-t/N.tauS), 0, 1, 1);
  }
  if (S.incense) { const I = SRC.incense; add(incenseX(), I.tipY + 0.002, I.R, 1, 0, 0, I.dT, I.smoke, 0, 1, 1); }
  const h = S.wave ? waveState(simT) : (hand.on ? hand : null);
  if (h) add(h.x, h.y, SRC.hand.R, 1, h.vx, h.vy, 0, 0, 1, 0, 0);
  // room draft: occasional soft nudges toward a random velocity of magnitude S.draft (bounded, ★)
  if (S.draft > 0 && Math.random() < SRC.draft.rate*dt) {
    const ang = Math.random()*2*Math.PI;
    draftQueue.push([Math.random()*Wm, Math.random()*Hm, S.draft*Math.cos(ang), S.draft*Math.sin(ang)]);
  }
  for (const d of draftQueue.splice(0)) if (a.length/4 < 12) add(d[0], d[1], SRC.draft.R, SRC.draft.blend, d[2], d[3], 0, 0, 1, 0, 0);
  return { k: a.length/4, a, b, m };
}

/* ==========================================================================
   ONE SIMULATION STEP
   ========================================================================== */
function step(dt) {
  const U = { uDt: dt, uDx: dx };
  run('advect', T.a, U, { uV: T.st, uQ: T.st });
  let res = T.a;
  if (S.mac) {
    run('advect', T.b, { uDt: -dt, uDx: dx }, { uV: T.st, uQ: T.a });
    run('correct', T.c, U, { uS: T.st, uA: T.a, uB: T.b });
    res = T.c;
  }
  const src = gatherSources(dt);
  const pad = (arr) => { const o = new Float32Array(48); o.set(arr.slice(0, 48)); return o; };
  const Ub = breezeAt(simT + dt), accel = (Ub - lastBreeze)/dt; lastBreeze = Ub;
  run('forces', T.st, { uDt: dt, uDx: dx, uG: CONST.g, uT0: CONST.T0, uNu: CONST.nu, uAl: CONST.alpha, uCool: S.cool, uAccel: accel,
    uK: { int: src.k }, uPa: { v4: pad(src.a) }, uPb: { v4: pad(src.b) }, uPm: { v4: pad(src.m) } }, { uS: res });
  run('div', T.div, { uDx: dx }, { uS: T.st });
  for (let i = 0; i < S.vcycles; i++) vcycle(0);      // warm-started from last step's pressure
  T.p0 = MG[0].p0; T.p1 = MG[0].p1;
  run('grad', T.a, { uDx: dx }, { uS: T.st, uP: T.p0 });
  [T.st, T.a] = [T.a, T.st];
  simT += dt;
}

function readback() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.st.f);
  gl.readPixels(0, 0, nx, ny, gl.RGBA, gl.FLOAT, readBuf);
}

/* ==========================================================================
   CPU FIELD SAMPLING (same ghost rules as the shaders)
   ========================================================================== */
function cf(i, j, k) {
  if (i < 0) { if (!openLeft()) return k === 0 ? breezeNow() : 0; i = 0; }
  let sg = 1;
  if (i >= nx) { i = nx - 1; if (k === 0 && !openRight()) sg = -1; }
  if (j < 0) { j = 0; if (k === 1) sg = -1; }
  if (j >= ny) { j = ny - 1; if (k === 1 && !S.openTop) sg = -sg; }
  return sg*readBuf[(j*nx + i)*4 + k];
}
function sample(x, y, k) {
  let qx = x/dx - 0.5, qy = y/dx - 0.5;
  qx = Math.min(Math.max(qx, -1), nx); qy = Math.min(Math.max(qy, -1), ny);
  const i = Math.floor(qx), j = Math.floor(qy), fx = qx - i, fy = qy - j;
  const a = cf(i, j, k), b = cf(i + 1, j, k), c = cf(i, j + 1, k), d = cf(i + 1, j + 1, k);
  return (a*(1 - fx) + b*fx)*(1 - fy) + (c*(1 - fx) + d*fx)*fy;
}
const vel = (x, y) => [sample(x, y, 0), sample(x, y, 1)];
const inside = (x, y) => x >= 0 && x <= Wm && y >= 0 && y <= Hm;

/* ==========================================================================
   LAGRANGIAN DIAGNOSTICS: streaklines, pathlines, streamlines
   ========================================================================== */
const STREAK_AGE = 8;      // s of history drawn per streakline
const STREAK_MAX = 8000;   // parcels per streakline (limits refinement cost)
const PATH_EVERY = 0.6;    // s between pathline particle releases
const PATH_LIFE = 5;       // s a pathline particle is tracked
let streaks = new Map(), paths = new Map(), lastPathRelease = new Map();

function seeds() {
  const out = [];
  const C = SRC.candle;
  if (S.candle) out.push({ id: 'candle', x: candleX(), y: C.y });
  else if (S.snuffT >= 0 && simT - S.snuffT < SRC.snuff.dur) out.push({ id: 'candle', x: candleX(), y: SRC.snuff.y });
  if (S.incense) out.push({ id: 'incense', x: incenseX(), y: SRC.incense.tipY + 0.002 });
  probes.forEach((p, i) => out.push({ id: 'p' + p.id, x: p.x, y: p.y }));
  return out;
}
function resetParticles() { streaks = new Map(); paths = new Map(); lastPathRelease = new Map(); }

function rk2(p, dt) {
  const k1 = vel(p.x, p.y);
  const k2 = vel(p.x + 0.5*dt*k1[0], p.y + 0.5*dt*k1[1]);
  p.x += dt*k2[0]; p.y += dt*k2[1];
  if (!inside(p.x, p.y)) p.dead = true;
}

function updateParticles(dt, nsub) {
  const sd = seeds(), live = new Set(sd.map(s => s.id));
  for (const k of streaks.keys()) if (!live.has(k)) streaks.delete(k);
  const h = dt/nsub;
  for (let n = 0; n < nsub; n++) {
    const t = simT - dt + (n + 1)*h;
    for (const s of sd) {
      let L = streaks.get(s.id); if (!L) streaks.set(s.id, L = []);
      for (const p of L) if (!p.dead) rk2(p, h);
      L.push({ x: s.x, y: s.y, t0: t });
      // keep the line resolved where the flow stretches it: wherever neighbours are more than
      // 4 cells apart, fill the gap with interpolated parcels about 3 cells apart (one O(n) pass).
      // If heavy mixing stretches the line past STREAK_MAX parcels, its oldest end is dropped.
      let R = null;
      for (let i = 1; i < L.length; i++) {
        const p = L[i], q = L[i - 1];
        const d = (p.dead || q.dead) ? 0 : Math.hypot(p.x - q.x, p.y - q.y);
        if (d > 4*dx && !R) R = L.slice(0, i);
        if (R) {
          if (d > 4*dx) {
            const m = Math.min(Math.ceil(d/(3*dx)) - 1, 64);
            for (let k = 1; k <= m; k++) { const f = k/(m + 1); R.push({ x: q.x + (p.x - q.x)*f, y: q.y + (p.y - q.y)*f, t0: q.t0 + (p.t0 - q.t0)*f }); }
          }
          R.push(p);
        }
      }
      if (R) streaks.set(s.id, L = R);
      if (L.length > 1 && L[0].dead && L[1].dead) { L = L.filter((p, i) => !p.dead || !L[i + 1]?.dead); streaks.set(s.id, L); }
      if (L.length > STREAK_MAX) L.splice(0, L.length - STREAK_MAX);
      let k0 = 0; while (k0 < L.length && t - L[k0].t0 > STREAK_AGE) k0++;
      if (k0) L.splice(0, k0);

      let P = paths.get(s.id); if (!P) paths.set(s.id, P = []);
      for (const p of P) if (!p.dead && t - p.t0 < PATH_LIFE) { rk2(p, h); p.hist.push(p.x, p.y); }
      const last = lastPathRelease.get(s.id) ?? -1e9;
      if (t - last >= PATH_EVERY) { P.push({ x: s.x, y: s.y, t0: t, hist: [s.x, s.y] }); lastPathRelease.set(s.id, t); }
      while (P.length && t - P[0].t0 > PATH_LIFE + 1.5) P.shift();
    }
  }
  for (const k of paths.keys()) if (!live.has(k)) paths.delete(k);
}

// instantaneous streamline: dx/ds = u/|u| in the frozen field, RK4
function streamline(x, y, dir, maxLen) {
  const hs = 0.6*dx*dir, pts = [x, y];
  const f = (x, y) => { const v = vel(x, y), s = Math.hypot(v[0], v[1]); return s < 2e-4 ? null : [v[0]/s, v[1]/s]; };
  for (let L = 0; L < maxLen; L += Math.abs(hs)) {
    const k1 = f(x, y); if (!k1) break;
    const k2 = f(x + .5*hs*k1[0], y + .5*hs*k1[1]); if (!k2) break;
    const k3 = f(x + .5*hs*k2[0], y + .5*hs*k2[1]); if (!k3) break;
    const k4 = f(x + hs*k3[0], y + hs*k3[1]); if (!k4) break;
    x += hs*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0])/6; y += hs*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1])/6;
    if (!inside(x, y)) break;
    pts.push(x, y);
  }
  return pts;
}

/* ==========================================================================
   DRAWING (overlay canvas in CSS pixels)
   ========================================================================== */
let cssW = 1, cssH = 1, dpr = 1;
const sx = x => x/Hm*cssH, sy = y => cssH - y/Hm*cssH, pxPerM = () => cssH/Hm;

function polyline(arr, color, width, alpha) {
  if (arr.length < 4) return;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.moveTo(sx(arr[0]), sy(arr[1]));
  for (let i = 2; i < arr.length; i += 2) ctx.lineTo(sx(arr[i]), sy(arr[i + 1]));
  ctx.stroke(); ctx.globalAlpha = 1;
}

function drawScene() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (S.vec) drawVectors();
  if (S.field) {
    const gx = 14, gy = Math.max(5, Math.round(14*Hm/Wvis));
    for (let i = 0; i < gx; i++) for (let j = 0; j < gy; j++) {
      const x = (i + .5)/gx*Wvis, y = (j + .5)/gy*Hm;
      polyline(streamline(x, y, 1, 0.08), '#ff6fb5', 1, .35);
      polyline(streamline(x, y, -1, 0.08), '#ff6fb5', 1, .35);
    }
  }
  if (S.stream) for (const s of seeds()) {
    polyline(streamline(s.x, s.y, 1, 0.7), '#ff6fb5', 1.6, .95);
    if (s.id[0] === 'p') polyline(streamline(s.x, s.y, -1, 0.7), '#ff6fb5', 1.6, .95);
  }
  if (S.path) for (const P of paths.values()) for (const p of P) {
    const age = simT - p.t0, a = age < PATH_LIFE ? .9 : Math.max(0, .9*(1 - (age - PATH_LIFE)/1.5));
    polyline(p.hist, '#5fd4ff', 1.3, a);
    if (!p.dead && age < PATH_LIFE) { ctx.fillStyle = '#5fd4ff'; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 2.4, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  }
  if (S.streak) for (const L of streaks.values()) {
    // draw newest→oldest, fading with age, breaking where particles left the window
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 1.6;
    // stroke in short runs so the fade can change along the line
    let run = 0; ctx.beginPath();
    for (let i = L.length - 1; i > 0; i--) {
      const p = L[i], q = L[i - 1];
      // a gap the refinement could not fill (heavy mixing) is left open rather than bridged
      if (p.dead || q.dead || Math.abs(p.x - q.x) + Math.abs(p.y - q.y) > 8*dx) continue;
      if (run === 0) { ctx.globalAlpha = Math.max(0, 1 - (simT - q.t0)/STREAK_AGE)*.95; ctx.beginPath(); }
      ctx.moveTo(sx(p.x), sy(p.y)); ctx.lineTo(sx(q.x), sy(q.y));
      if (++run === 12 || i === 1) { ctx.stroke(); run = 0; }
    }
    if (run) ctx.stroke();
    ctx.globalAlpha = 1;
  }
  drawProps();
  drawLegend();
}

function drawVectors() {
  const spacing = 26, tau = 0.1;            // arrow length = distance travelled in τ = 0.1 s
  const k = pxPerM()*tau;
  ctx.strokeStyle = '#b7f36b'; ctx.lineWidth = 1.1;
  for (let py = spacing/2; py < cssH; py += spacing) for (let px = spacing/2; px < cssW; px += spacing) {
    const x = px/cssH*Hm, y = (cssH - py)/cssH*Hm;
    const v = vel(x, y), s = Math.hypot(v[0], v[1]);
    if (s < 1e-3) continue;
    let L = s*k, ex = v[0]/s, ey = -v[1]/s;
    const maxL = spacing*2.2; if (L > maxL) L = maxL;
    ctx.globalAlpha = Math.min(1, .25 + s*3);
    const x1 = px + ex*L, y1 = py + ey*L, hh = Math.min(5, L*.4);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x1, y1);
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - hh*(ex*.85 - ey*.5), y1 - hh*(ey*.85 + ex*.5));
    ctx.moveTo(x1, y1); ctx.lineTo(x1 - hh*(ex*.85 + ey*.5), y1 - hh*(ey*.85 - ex*.5));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawProps() {
  const C = SRC.candle, cx = sx(candleX()), base = sy(0), k = pxPerM();
  // table edge
  ctx.fillStyle = '#17181d'; ctx.fillRect(0, base - 2, cssW, 2);
  // candle body + wick
  const bw = C.bodyW*k, bh = C.bodyH*k;
  const g = ctx.createLinearGradient(cx - bw/2, 0, cx + bw/2, 0);
  g.addColorStop(0, '#cfc6b4'); g.addColorStop(.5, '#f1ebdd'); g.addColorStop(1, '#a9a191');
  ctx.fillStyle = g; ctx.fillRect(cx - bw/2, base - bh, bw, bh);
  ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(1, .0012*k);
  ctx.beginPath(); ctx.moveTo(cx, base - bh); ctx.lineTo(cx, base - bh - .006*k); ctx.stroke();
  if (S.candle) {
    // illustrative flame, leaning with the local horizontal air speed (not part of the physics)
    const u = sample(candleX(), C.bodyH + C.flameH*.6, 0);
    const lean = Math.atan2(u, 0.8);
    const fy = base - bh - .006*k, fh = C.flameH*k, fw = .009*k;
    ctx.save(); ctx.translate(cx, fy); ctx.rotate(lean);
    const fg = ctx.createRadialGradient(0, -fh*.3, 1, 0, -fh*.35, fh*.7);
    fg.addColorStop(0, 'rgba(255,250,225,1)'); fg.addColorStop(.35, 'rgba(255,200,90,.95)'); fg.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = fg; ctx.beginPath();
    ctx.moveTo(0, -fh); ctx.bezierCurveTo(fw, -fh*.5, fw, 0, 0, 0); ctx.bezierCurveTo(-fw, 0, -fw, -fh*.5, 0, -fh); ctx.fill();
    ctx.fillStyle = 'rgba(80,120,255,.55)'; ctx.beginPath(); ctx.ellipse(0, -fh*.08, fw*.45, fh*.1, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else if (S.snuffT >= 0 && simT - S.snuffT < 2.5) {
    ctx.fillStyle = `rgba(255,90,30,${.8*(1 - (simT - S.snuffT)/2.5)})`;
    ctx.beginPath(); ctx.arc(cx, base - bh - .006*k, 2, 0, 7); ctx.fill();
  }
  // incense: holder, stick, glowing tip
  const ix = sx(incenseX()), I = SRC.incense;
  ctx.fillStyle = '#2a2622'; ctx.beginPath(); ctx.ellipse(ix, base - 3, .022*k, 4, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = Math.max(1.5, .0022*k);
  ctx.beginPath(); ctx.moveTo(ix, base - 4); ctx.lineTo(ix, sy(I.tipY)); ctx.stroke();
  if (S.incense) {
    const tg = ctx.createRadialGradient(ix, sy(I.tipY), 0, ix, sy(I.tipY), 6);
    tg.addColorStop(0, 'rgba(255,140,60,1)'); tg.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(ix, sy(I.tipY), 6, 0, 7); ctx.fill();
  }
  // hand
  const h = S.wave ? waveState(simT) : (hand.on ? hand : null);
  if (h) {
    ctx.strokeStyle = 'rgba(255,230,200,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(sx(h.x), sy(h.y), SRC.hand.R*k, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,230,200,.8)'; ctx.font = '11px ui-sans-serif,system-ui';
    ctx.fillText(`hand ${Math.hypot(h.vx, h.vy).toFixed(2)} m/s`, sx(h.x) + SRC.hand.R*k + 4, sy(h.y) + 4);
  }
  // probes
  for (const p of probes) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 5, 0, 7); ctx.moveTo(sx(p.x) - 8, sy(p.y)); ctx.lineTo(sx(p.x) + 8, sy(p.y));
    ctx.moveTo(sx(p.x), sy(p.y) - 8); ctx.lineTo(sx(p.x), sy(p.y) + 8); ctx.stroke();
  }
}

function drawLegend() {
  const panelOpen = !panel.classList.contains('hidden') && cssW > 640;
  const right = cssW - (panelOpen ? 316 : 16), k = pxPerM();
  let y = cssH - 18;
  ctx.font = '11px ui-sans-serif,system-ui'; ctx.textAlign = 'right'; ctx.fillStyle = '#9a9ca3';
  // 10 cm scale bar
  const L = 0.10*k;
  ctx.strokeStyle = '#cfcfcf'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(right - L, y); ctx.lineTo(right, y); ctx.moveTo(right - L, y - 4); ctx.lineTo(right - L, y + 4); ctx.moveTo(right, y - 4); ctx.lineTo(right, y + 4); ctx.stroke();
  ctx.fillText('10 cm', right - L - 6, y + 4);
  if (S.vec) {
    y -= 18; const a = 0.5*0.1*k;
    ctx.strokeStyle = '#b7f36b'; ctx.beginPath(); ctx.moveTo(right - a, y); ctx.lineTo(right, y); ctx.lineTo(right - 4, y - 3); ctx.moveTo(right, y); ctx.lineTo(right - 4, y + 3); ctx.stroke();
    ctx.fillText('0.5 m/s (arrow = travel in 0.1 s)', right - a - 6, y + 4);
  }
  ctx.textAlign = 'left';
}

const hud = document.getElementById('hud');
let mouse = null, fpsEMA = 60, rtEMA = 1;
function updateHUD() {
  let s = `t = ${simT.toFixed(1)} s   grid ${nx}×${ny}, cell ${(dx*1000).toFixed(2)} mm   window ${(Wvis*100).toFixed(0)}×${(Hm*100).toFixed(0)} cm\n`;
  s += `${fpsEMA.toFixed(0)} fps   sim speed ${(rtEMA).toFixed(2)}× real time${S.paused ? '   PAUSED' : ''}`;
  if (mouse && readBuf) {
    const x = mouse.x/cssH*Hm, y = (cssH - mouse.y)/cssH*Hm;
    if (inside(x, y)) {
      const u = sample(x, y, 0), v = sample(x, y, 1), dT = sample(x, y, 2);
      s += `\nat (${(x*100).toFixed(1)}, ${(y*100).toFixed(1)}) cm:  u ${(u*100).toFixed(1)}  v ${(v*100).toFixed(1)}  |u| ${(Math.hypot(u, v)*100).toFixed(1)} cm/s   ΔT ${dT.toFixed(1)} K`;
    }
  }
  hud.textContent = s;
}
function toWorld(e) { const r = ov.getBoundingClientRect(); const px = e.clientX - r.left, py = e.clientY - r.top; return { px, py, x: px/cssH*Hm, y: (cssH - py)/cssH*Hm }; }
let probeId = 0;
ov.addEventListener('pointerdown', e => {
  const w = toWorld(e);
  if (S.tool === 'probe') {
    const i = probes.findIndex(p => Math.hypot(sx(p.x) - w.px, sy(p.y) - w.py) < 12);
    if (i >= 0) probes.splice(i, 1); else if (probes.length < 8) probes.push({ x: w.x, y: w.y, id: probeId++ });
    return;
  }
  ov.setPointerCapture(e.pointerId);
  Object.assign(hand, { on: true, x: w.x, y: w.y, vx: 0, vy: 0, lastX: w.x, lastY: w.y, lastT: performance.now() });
  ov.style.cursor = 'grabbing';
});
ov.addEventListener('pointermove', e => {
  const w = toWorld(e); mouse = { x: w.px, y: w.py };
  if (!hand.on) return;
  const now = performance.now(), dtr = (now - hand.lastT)/1000;
  if (dtr <= 0.001) return;
  // pointer displacement over the *simulated* time that elapsed, so slow motion stays consistent
  const dts = dtr*S.timeScale;
  let vx = (w.x - hand.lastX)/dts, vy = (w.y - hand.lastY)/dts;
  const sp = Math.hypot(vx, vy); if (sp > SRC.hand.maxV) { vx *= SRC.hand.maxV/sp; vy *= SRC.hand.maxV/sp; }
  hand.vx = .5*hand.vx + .5*vx; hand.vy = .5*hand.vy + .5*vy;
  Object.assign(hand, { x: w.x, y: w.y, lastX: w.x, lastY: w.y, lastT: now });
});
const endHand = () => { hand.on = false; ov.style.cursor = ''; };
ov.addEventListener('pointerup', endHand); ov.addEventListener('pointercancel', endHand);
ov.addEventListener('pointerleave', () => { mouse = null; });

/* ==========================================================================
   ABOUT PANEL: equations, constants, estimates
   ========================================================================== */
const ABOUT_HTML = `
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)">Physics &amp; constants</h2><button data-close="1">Close</button></div>
<p>The air is simulated; the smoke, heat and lines are only ways of looking at it. Everything runs in SI units at 1:1 real time (the HUD shows if your machine falls behind). Values marked <span class="star">★</span> are estimates, not measurements of this scene.</p>

<h3>Governing equations (2D, incompressible, Boussinesq)</h3>
<div class="eq">∂u/∂t + (u·∇)u = −∇p/ρ₀ + ν∇²u + g β ΔT ŷ + f_sources
∇·u = 0
∂ΔT/∂t + (u·∇)ΔT = α∇²ΔT − k ΔT          (k = out-of-plane loss slider, default 0)
∂c/∂t + (u·∇)c = 0                       (c = smoke concentration, passive)</div>
<p>β = 1/T₀ for an ideal gas, so buoyant acceleration is g·ΔT/T₀ (about 3.3 cm/s² per kelvin).</p>

<h3>The three line types</h3>
<div class="eq">streamline   dx/ds ∥ u(x, t₀)          tangent to the velocity field frozen at one instant
pathline     dx/dt = u(x(t), t)          the trajectory of one air parcel over time
streakline   { x_τ(t) : x_τ(τ) = x₀ }     every parcel that passed the seed x₀, released at all τ ≤ t</div>
<p>Smoke from a fixed source is a streakline, blurred by diffusion. In steady flow all three coincide. They split apart whenever the flow changes in time, which is why a drifting smoke trail can show a curl that the air at that moment does not have. Streamlines are drawn downstream from the sources and both ways from probes, with RK4 at a step of 0.6 cells. Pathline parcels are released every ${PATH_EVERY} s and followed for ${PATH_LIFE} s; streaklines keep ${STREAK_AGE} s of history. Parcels move with RK2 through the same velocity field the smoke sees. Where the flow stretches a streakline, interpolated parcels are inserted wherever neighbours drift more than 4 cells apart, so the line stays continuous (the inserted parcels are an approximation). If mixing stretches a line past ${STREAK_MAX} parcels its oldest end is dropped, and any gap that cannot be filled is left open rather than bridged with a false straight segment.</p>

<h3>Constants</h3>
<table>
<tr><th>Quantity</th><th>Value</th><th>Note</th></tr>
<tr><td>g</td><td>9.81 m/s²</td><td>standard gravity</td></tr>
<tr><td>T₀</td><td>293.15 K</td><td>20 °C room</td></tr>
<tr><td>ν (air)</td><td>1.5×10⁻⁵ m²/s</td><td>20 °C, 1 atm</td></tr>
<tr><td>α (air)</td><td>2.2×10⁻⁵ m²/s</td><td>thermal diffusivity, 20 °C</td></tr>
<tr><td>Smoke settling</td><td>≈3×10⁻⁶ m/s</td><td>Stokes law, d = 0.3 µm, ρ = 1000 kg/m³: ignored, so smoke is a pure tracer</td></tr>
<tr><td>Smoke Brownian diffusion</td><td>≈10⁻¹⁰ m²/s</td><td>ignored (numerical diffusion is far larger)</td></tr>
<tr><td>Window</td><td>${CONST.H*100} cm tall</td><td>width follows your screen</td></tr>
</table>

<h3>Sources <span class="star">★</span></h3>
<table>
<tr><th>Source</th><th>Model</th><th>Values</th></tr>
<tr><td>Candle (lit)</td><td>Gaussian patch just above the flame, imposed ΔT, upward velocity and a trace of soot. A steady candle flame burns almost sootlessly, so its plume is nearly invisible (that is real).</td><td>R ${SRC.candle.R*1000} mm ★, ΔT ${SRC.candle.dT} K ★, w₀ ${SRC.candle.w0} m/s ★ (published candle plume speeds ~0.3–1 m/s; heat release ~40–80 W)</td></tr>
<tr><td>Candle (snuffed)</td><td>Smouldering wick: heat and dense smoke, both decaying exponentially.</td><td>ΔT ${SRC.snuff.dT0} K, τ ${SRC.snuff.tauT} s ★; smoke τ ${SRC.snuff.tauS} s ★</td></tr>
<tr><td>Incense</td><td>Hot, smoky patch at the tip. No imposed velocity: buoyancy alone lifts it.</td><td>R ${SRC.incense.R*1000} mm ★ (clamped to ≥0.7 cell), ΔT ${SRC.incense.dT} K ★</td></tr>
<tr><td>Hand</td><td>Air within a Gaussian of radius R is forced to the hand's velocity, like a porous moving body. A still, pressed hand acts as an obstacle.</td><td>R ${SRC.hand.R*100} cm ★; speed = pointer speed in metres per simulated second. Auto wave: ±${SRC.wave.ampMax*100} cm, period ${SRC.wave.period} s</td></tr>
<tr><td>Room draft</td><td>About ${SRC.draft.rate} times a second, a ${SRC.draft.R*100} cm patch of air is nudged toward a random direction at the slider speed. Real rooms move at ~2–10 cm/s; this is what breaks laminar plumes.</td><td>★</td></tr>
<tr><td>Breeze &amp; gusts</td><td>A uniform free stream U(t) = U·(1 + gust·sin 2πt/${SRC.gustPeriod} s). It enters through the left edge, and every change in U is applied to the whole window as a uniform acceleration dU/dt, the way a large-scale pressure gradient drives a real gust.</td><td>gust period ★</td></tr>
</table>

<h3>Numerics</h3>
<p>Stable fluids (Stam 1999) on a collocated grid on the GPU: MacCormack advection with a min/max limiter (Selle et al. 2008) for velocity, heat and smoke; explicit viscosity and heat diffusion; pressure projection by geometric multigrid (cell-centred V-cycles, weighted-Jacobi smoothing, warm-started from the previous step; 3 cycles cut the residual by roughly 10³); time step ≤ 1/60 s and ≤ 0.2·dx²/α for diffusion stability. Boundaries: free-slip floor (the table); every other edge open (p = 0, zero-gradient velocity), so the window looks into a large still room. With a breeze, the left edge becomes a uniform inflow.</p>

<h3>Checks against plume theory</h3>
<p>Measured in this sim (320-cell grid, candle alone, 2 cm/s room draft, mean over 3–12 s, peak upward speed across the plume) and compared with the Morton–Taylor–Turner point-plume law w = 4.7·B<sup>1/3</sup>·z<sup>−1/3</sup>, B = gQ/(ρc<sub>p</sub>T₀), z from the wick:</p>
<table>
<tr><th>Height above table</th><th>Sim, candle</th><th>MTT, 60 W convective ★</th></tr>
<tr><td>20 cm</td><td>0.94 m/s</td><td>1.17 m/s</td></tr>
<tr><td>30 cm</td><td>1.00 m/s</td><td>0.94 m/s</td></tr>
<tr><td>45 cm</td><td>0.59 m/s</td><td>0.79 m/s</td></tr>
</table>
<p>The sim lands within about 25% of the fully turbulent MTT law (mostly below it, as expected near a candle where the plume is still laminar or transitional), and slows with height as the law says it should. The 2D plume also flaps from side to side, so these means hide a lot of swing. Incense alone: 0.16–0.20 m/s from 5 to 20 cm above the tip ★ (a laminar plume; there is no measurement to compare against here). With both sources lit, the candle plume draws the incense smoke toward it. That merging is real entrainment, though a 2D slice exaggerates it. Air far from the plumes moves at 2–8 cm/s, drawn in by entrainment, which matches typical still-room air speeds.</p>

<h3>Known departures from reality (flagged)</h3>
<ul>
<li><b>2D, not 3D.</b> The sim is a vertical slice, so each source behaves like an infinitely long line source. A real (point) plume entrains air from all sides and slows with height (w ∝ z^−1/3); a 2D plane plume does not. The out-of-plane heat loss slider is a crude stand-in for that sideways dilution ★.</li>
<li><b>Resolution.</b> One cell is ${'{dx}'} mm. Flames and incense tips are only a few cells across, which is why the sources are imposed patches rather than modelled combustion.</li>
<li><b>Numerical diffusion.</b> Semi-Lagrangian advection smears momentum with an effective viscosity of roughly u·dx/2, about 10–30× air's ν at these speeds, even with MacCormack. Plumes stay laminar longer and turbulence is coarser than in life. There is no turbulence model and no vorticity confinement (that adds energy that is not there).</li>
<li><b>The hand is a bar.</b> In a 2D slice a hand is an infinitely long bar, so it pushes more air than a real hand, which air can also flow around above and below.</li>
<li><b>Boussinesq near the flame.</b> ΔT/T₀ ≈ 0.85 at the candle source, outside the small-ΔT range the approximation assumes; buoyancy there is approximate.</li>
<li><b>Pressure solve.</b> Jacobi with a finite iteration count leaves a small residual divergence, mostly at large scales. More iterations means more accuracy and less speed.</li>
<li><b>The flame drawing</b> leans with the local air speed for illustration only; it plays no part in the physics.</li>
</ul>
`;
function renderAbout() { $('aboutBox').innerHTML = ABOUT_HTML.replace('{dx}', (dx*1000).toFixed(2)); }

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = ov.clientWidth; cssH = ov.clientHeight;
  ov.width = Math.round(cssW*dpr); ov.height = Math.round(cssH*dpr);
  glc.width = Math.round(cssW*dpr); glc.height = Math.round(cssH*dpr);
  const newNx = Math.max(64, Math.ceil(S.res*cssW/cssH/64)*64);
  if (!T || newNx !== nx || S.res !== ny) { buildSim(); }
  Wvis = CONST.H*cssW/cssH;
  renderAbout();
}
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

let lastFrame = performance.now();
function frame(now) {
  const real = Math.max(0, Math.min(0.1, (now - lastFrame)/1000)); lastFrame = now;
  fpsEMA = .95*fpsEMA + .05*(1/Math.max(real, 1e-3));
  if (!S.paused && real > 0) {
    const want = real*S.timeScale;
    const dt = Math.min(want, (1/30)*S.timeScale);          // drop time rather than explode on long frames
    const dtMax = Math.min(1/60, 0.2*dx*dx/CONST.alpha);
    const n = Math.max(1, Math.ceil(dt/dtMax - 1e-9)), h = dt/n;
    // "Snuffed" preset: the flame burns for a moment first, so the wick and air are already hot
    if (S.autoSnuffAt >= 0 && simT >= S.autoSnuffAt) { S.candle = false; S.snuffT = simT; S.autoSnuffAt = -1; syncUI(); }
    for (let i = 0; i < n; i++) step(h);
    readback();
    updateParticles(dt, n);
    rtEMA = .95*rtEMA + .05*(dt/Math.max(real, 1e-3));
  }
  run('display', null, { uRes: { v2: [glc.width, glc.height] }, uSmoke: S.smoke ? 1 : 0, uHeat: S.heat ? 1 : 0 }, { uS: T.st });
  drawScene();
  updateHUD();
  requestAnimationFrame(frame);
}
resize(); syncUI();
requestAnimationFrame(frame);
</script>
